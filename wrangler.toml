name = "nexora-api-model"
main = "src/index.js"
compatibility_date = "2026-09-23"

[vars]
NEXORA_MODEL = "@cf/openai/gpt-oss-120b"
NEXORA_MODEL_NAME = "nexora-coder"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "nexora-api"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
